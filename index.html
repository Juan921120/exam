<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI训练师三级 · 在线模拟测试</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- ============================================================
       TOP BAR (shared across pages, content changes per page)
       ============================================================ -->
  <header class="topbar" id="topbar">
    <div class="container">
      <a class="topbar-brand" href="#" onclick="goHome(); return false;">
        <span class="brand-icon">AI</span>
        <span>AI训练师三级</span>
      </a>
      <div id="topbar-right" class="topbar-meta">共 900 题库</div>
    </div>
  </header>

  <!-- ============================================================
       PAGE: HOME
       ============================================================ -->
  <main class="page active" id="page-home">
    <div class="container">
      <div class="home-hero">
        <h1>人工智能训练师<br>三级理论题库</h1>
        <p>随机抽取 10 题，完成后查看解析与错题分析</p>
        <div class="home-stats">
          <div class="home-stat">
            <div class="home-stat-num" id="stat-tf">—</div>
            <div class="home-stat-label">判断题</div>
          </div>
          <div class="home-stat">
            <div class="home-stat-num" id="stat-single">—</div>
            <div class="home-stat-label">单选题</div>
          </div>
          <div class="home-stat">
            <div class="home-stat-num" id="stat-multi">—</div>
            <div class="home-stat-label">多选题</div>
          </div>
        </div>
      </div>

      <!-- Config card -->
      <div class="home-config">
        <h3>出题设置</h3>

        <!-- Mode selector -->
        <div class="config-row">
          <label>
            出题模式
            <small>顺序模式：从第1题开始，每次10题，断点续做；随机模式：完全随机抽取</small>
          </label>
        </div>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="sequential" onclick="setMode('sequential')">
            📋 顺序模式
          </button>
          <button class="mode-btn" data-mode="random" onclick="setMode('random')">
            🎲 随机模式
          </button>
        </div>

        <!-- Sequential progress -->
        <div id="sequential-progress-area" class="sequential-progress">
          <div class="sequential-progress-bar">
            <div class="sequential-progress-fill" id="seq-progress-fill" style="width:0%"></div>
          </div>
          <div class="sequential-progress-text">
            <span>已覆盖 <strong id="seq-covered">0</strong> / 900 题</span>
            <button class="btn btn-ghost btn-sm" onclick="resetSequentialProgress()" style="font-size:11px;color:var(--clr-wrong)">重置进度</button>
          </div>
        </div>

        <div class="config-row">
          <label>
            每次题数
            <small>随机模式：10题；顺序模式：最多10题（末尾可能不足）</small>
          </label>
          <span style="font-size:14px;font-weight:600;color:var(--clr-primary)">最多 10</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block btn-lg" onclick="startQuiz()">
        🚀 开始测试
      </button>

      <!-- Mistake book entry -->
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn btn-outline" style="flex:1" onclick="gotoMistakes()">
          📒 错题本
          <span id="mistakes-count-badge" style="font-size:12px;color:var(--clr-text-3)">—</span>
        </button>
      </div>

      <!-- History -->
      <div style="margin-top:28px">
        <div class="section-title">📊 最近记录</div>
        <div id="history-list" class="history-list"></div>
      </div>
    </div>
  </main>

  <!-- ============================================================
       PAGE: QUIZ
       ============================================================ -->
  <main class="page" id="page-quiz">
    <div class="container quiz-content">

      <!-- Progress area -->
      <div class="card" style="margin-bottom:16px;padding:18px 24px">
        <div class="progress-label">
          <span id="progress-text">0 / 10 已作答</span>
          <span id="topbar-timer-inline" class="topbar-timer">
            ⏱ <span id="timer-display">00:00</span>
          </span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="q-nav" id="q-nav-dots"></div>
      </div>

      <!-- Question card -->
      <div class="quiz-card" id="question-card">
        <!-- Rendered by JS -->
      </div>

      <!-- Nav buttons -->
      <div class="quiz-footer" id="quiz-footer">
        <button class="btn btn-outline btn-sm" id="btn-prev" onclick="prevQuestion()">
          ← 上一题
        </button>
        <div style="flex:1"></div>
        <button class="btn btn-outline btn-sm" id="btn-submit" onclick="openSubmitModal()">
          提交测试
        </button>
        <button class="btn btn-outline btn-sm" id="btn-back-mistakes" onclick="goBackFromReview()" style="display:none">
          ← 返回
        </button>
        <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">
          下一题 →
        </button>
      </div>

    </div>
  </main>

  <!-- ============================================================
       PAGE: RESULT
       ============================================================ -->
  <main class="page" id="page-result">
    <div class="container">
      <div class="result-hero">
        <div class="result-score-circle">
          <span class="result-score-num" id="result-score-num">—</span>
          <span class="result-score-den" id="result-score-den">/10</span>
        </div>
        <h2 id="result-grade">—</h2>
        <p id="result-pct-big">—</p>
      </div>

      <div class="result-stats">
        <div class="result-stat">
          <div class="result-stat-num" id="result-correct" style="color:var(--clr-correct)">—</div>
          <div class="result-stat-label">答对</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-num" id="result-wrong" style="color:var(--clr-wrong)">—</div>
          <div class="result-stat-label">答错</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-num" id="result-pct" style="color:var(--clr-primary)">—</div>
          <div class="result-stat-label">正确率</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:14px;color:var(--clr-text-2)">⏱ 用时</span>
          <strong id="result-time">—</strong>
        </div>
      </div>

      <div class="result-actions">
        <button class="btn btn-primary btn-block btn-lg" onclick="startSessionReview()">
          📋 查看解析
        </button>
        <button class="btn btn-outline btn-block" onclick="startQuiz()">
          🔄 再来一次
        </button>
        <button class="btn btn-ghost btn-block" onclick="goHome()">
          ← 返回首页
        </button>
      </div>
    </div>
  </main>

  <!-- ============================================================
       PAGE: REVIEW (解析)
       ============================================================ -->
  <main class="page" id="page-review">
    <div class="container">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-top:8px">
        <h2 style="font-size:20px;font-weight:700">答题解析</h2>
        <button class="btn btn-ghost btn-sm" onclick="showPage('result')">← 返回成绩</button>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" data-filter="all"     onclick="setReviewFilter('all')">全部</button>
        <button class="tab-btn"        data-filter="wrong"   onclick="setReviewFilter('wrong')">答错</button>
        <button class="tab-btn"        data-filter="correct" onclick="setReviewFilter('correct')">答对</button>
      </div>

      <div id="review-list"></div>

      <button class="btn btn-outline btn-block" onclick="startQuiz()" style="margin-top:8px">
        🔄 重新测试
      </button>
    </div>
  </main>

  <!-- ============================================================
       PAGE: MISTAKES BOOK (错题本)
       ============================================================ -->
  <main class="page" id="page-mistakes">
    <div class="container">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-top:8px">
        <div>
          <h2 style="font-size:20px;font-weight:700">错题本</h2>
          <p id="mistakes-total" style="font-size:13px;color:var(--clr-text-3);margin-top:2px">加载中…</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="clearAllMistakes()">清空</button>
          <button class="btn btn-ghost btn-sm" onclick="goHome()">← 首页</button>
        </div>
      </div>
      <div id="mistakes-list"></div>
    </div>
  </main>

  <!-- ============================================================
       MODAL: Submit confirm
       ============================================================ -->
  <div class="modal-overlay hidden" id="submit-modal" onclick="closeSubmitModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>确认提交</h3>
      <p id="modal-msg"></p>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeSubmitModal()">再看看</button>
        <button class="btn btn-primary" onclick="confirmSubmit()">确认提交</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div><!-- /.app -->

<script src="app.js"></script>
<script>
  /* ── Extra UI glue (kept here to stay out of app.js) ── */

  function goHome() {
    stopTimer();
    renderHome();
    showPage('home');
    document.getElementById('topbar-right').textContent = '共 900 题库';
  }

  function gotoReview() {
    // 改为在答题页面上逐题查看解析（带对错对比）
    startSessionReview();
  }

  function gotoMistakes() {
    renderMistakes();
    showPage('mistakes');
  }

  /* Update topbar right area during quiz */
  const _origRenderQuiz = window.renderQuiz;
  // Wrap renderQuiz to also update topbar
  const __origRenderQuiz = renderQuiz;
  window._quizTopbarPatch = true;

  document.addEventListener('DOMContentLoaded', () => {
    // Patch: keep topbar updated during quiz
    const origStart = startQuiz;
    // Already called from HTML buttons, just update topbar on page switch
  });
</script>
</body>
</html>
